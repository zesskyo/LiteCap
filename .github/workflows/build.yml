name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (for MKV / RTMP integration tests)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Test
        run: swift test

  macos:
    name: macOS app
    runs-on: macos-15
    env:
      # Optional. Without these the app is ad-hoc signed (see README → Installing).
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      # Signs updates for the in-app updater (see scripts/setup-sparkle-keys.sh).
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "SIGN_ID=$IDENTITY" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build app and disk image
        run: ./build-app.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: LiteCap-dmg
          path: build/*.dmg
          if-no-files-found: error

      - name: Sign update and write appcast (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ] || [ ! -s Resources/SparklePublicKey.txt ]; then
            echo "::warning::Update key not set up (scripts/setup-sparkle-keys.sh), so this release won't be offered as an in-app update."
          else
            TAG="$GITHUB_REF_NAME" ./scripts/make-appcast.sh
          fi

      - name: Publish release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(build/*.dmg)
          [ -f build/appcast.xml ] && FILES+=(build/appcast.xml)
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
            --title "LiteCap ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Publish rolling "Latest build" (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-main --yes --cleanup-tag || true
          gh release create latest-main build/*.dmg --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (main)" \
            --notes "Built automatically from $GITHUB_SHA. For numbered releases, see the other releases."
